name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Law 4 of the Supabase work order: "a policy bug here is the one class of
    # bug that cannot ship even once." So the RLS policies are asserted against a
    # real Postgres, with the real policy SQL, not read back from the migration.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # The unit suite cannot see the class of bug that has twice reached main:
      # generators lost to minification, and a screen never wired to its engine.
      # Both are only visible in the bundle a kid actually loads, so CI runs the
      # built site in a real browser. `npm run test:webapp` rebuilds and serves
      # apps/web/dist as a plain static host — no dev server, no HMR.
      # Split so a slow run says WHICH HALF was slow. One run took 10m9s here
      # while every other step was normal (npm ci 1s, tests 8s, build 3s, e2e
      # 56s) — and with the two jobs in one step there was no way to tell the
      # browser download from the apt packages it pulls.
      - name: Cache the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Chromium (browser)
        run: npx playwright install chromium

      - name: Install Chromium (system packages)
        run: npx playwright install-deps chromium
      - name: E2E against the built bundle
        run: node tests/test_webapp.mjs

      # Row-level security, two families, every table. Locally this test borrows
      # the default server or initdbs a throwaway cluster; here it uses the
      # service container above.
      - name: Row-level security
        run: node tests/test_rls.mjs
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      # The four §0b teach layouts, desktop and phone, including the clause that
      # matters: a wrong pick shows the hint and never locks the step.
      - name: The teach-layout gallery
        run: node tests/test_layouts.mjs

      # Every step's duration, on the run page, so "CI was slow" is a reading
      # rather than a theory. GitHub has always recorded this; nobody looked,
      # and a 14-minute job got explained by guesswork about repo size.
      - name: Step timings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          sleep 2
          JQ='.jobs[] | select(.name=="test") | .steps[]
              | select(.started_at != null and .completed_at != null)
              | "| \((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | \(.name) |"'
          {
            echo "### Step timings"
            echo
            echo "| seconds | step |"
            echo "|--:|---|"
            gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq "$JQ" || echo "| ? | timings unavailable |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
