<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kampus — the campus of life</title>
<meta name="description" content="Real-life math for grades 3–8, built ADHD-first. Earn Kampus Kredits, run a lemonade stand, cash in for real rewards.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F7F5F1; --surface:#FFFFFF; --ink:#23252B; --ink-hover:#3A3D45;
  --t2:#5D5A52; --t3:#8A8578; --t4:#B5B0A4;
  --border:#E5E2DA; --border2:#F1EEE6; --track:#ECE9E1; --trackoff:#D8D4C9; --fillhov:#EEEBE3;
  --green:#58B372; --green-h:#4AA263; --green-d:#2E7C46; --green-t:#EAF6EE;
  --gold:#E8C94F; --gold-d:#A8862A; --gold-m:#D9B96A; --gold-a:#D9A93F; --gold-t:#FBF3E4; --gold-tb:#E8D9B8;
  --red:#E4766C; --red-t:#FBEDEC;
  --lime:#D9DE62; --lime-d:#5B5E1F; --lime-b:#4A4D1E;
  --orange:#EE8A55; --orange-d:#7C4A1D; --peach:#F4BE93;
  --w-frac:#F0AFCE; --w-ratio:#F4BE93; --w-int:#5E9FE0; --w-alg:#8F97DE;
  --qsize:54px; --mascot:100px; --anssize:22px; --anspad:20px;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{height:100%;}
body{
  font-family:'Inter Tight', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background:var(--ground); color:var(--ink); min-height:100%;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
body.band-a{--qsize:62px; --mascot:132px; --anssize:26px; --anspad:24px;}
body.band-c{--qsize:46px; --mascot:76px; --anssize:20px; --anspad:16px;}
body.theme-peach{--ground:#F9EFE6;}
body.theme-blossom{--ground:#FAEFF4;}
body.theme-mint{--ground:#EEF4EC;}
body.theme-midnight{
  --ground:#17181B; --surface:#232527; --ink:#F2F3F5; --ink-hover:#DADCE1;
  --t2:#B9BCC4; --t3:#8A8D96; --t4:#5F626B;
  --border:#3A3D42; --border2:#2E3034; --track:#2E3034; --fillhov:#2C2E33;
  --green-t:#1E2E23; --gold-t:#2E2A20; --gold-tb:#4A4232; --red-t:#33211F;
}
button{font-family:inherit; cursor:pointer;}
img{display:block;}
.hide{display:none !important;}

/* ---------- top nav ---------- */
#nav{
  position:sticky; top:0; z-index:10; display:flex; align-items:center;
  background:var(--ground); border-bottom:1px solid var(--border);
  padding:12px clamp(14px, 2.5vw, 32px); flex-wrap:wrap; row-gap:6px;
}
body.chromeless #nav{display:none;}
.brand{display:flex; align-items:center; gap:9px; font-size:19px; font-weight:800; letter-spacing:-.02em; margin-right:clamp(8px,1.5vw,22px); background:none; border:none; color:var(--ink);}
.navmid{display:flex; align-items:center; gap:2px; flex-wrap:wrap;}
.navsp{flex:1;}
.navitem{
  display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:6px;
  font-size:14.5px; font-weight:600; color:var(--ink); background:none; border:none; white-space:nowrap;
}
.navitem:hover{background:var(--fillhov);}
.navitem.on{background:var(--fillhov); font-weight:800;}
.navdot{width:8px; height:8px; border-radius:99px; flex-shrink:0;}
.navright{display:flex; align-items:center; gap:10px;}
.weekchip{display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:13.5px; font-weight:600; white-space:nowrap;}
.kbal{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 6px 6px 12px; font-size:14.5px; font-weight:800; color:var(--ink); }
.kbal .plusdisc{width:20px; height:20px; border-radius:99px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;}
.avchip{width:36px; height:36px; border-radius:6px; background:var(--surface); border:1px solid var(--border); padding:3px; }
.avchip img, .avchip svg{width:100%; height:100%; object-fit:contain;}

/* ---------- shared ---------- */
.screen{display:none;}
.screen.on{display:block;}
.wrapc{margin:0 auto; padding:30px 32px 48px;}
.w1060{max-width:1060px;} .w1000{max-width:1000px;} .w900{max-width:900px;} .w760{max-width:760px;}
.kicker{font-size:12px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--t3);}
.h1{font-size:clamp(34px,4.4vw,46px); font-weight:800; letter-spacing:-.03em; line-height:1.05;}
.body{font-size:16px; color:var(--t2); line-height:1.5;}
.meta{font-size:13px; color:var(--t3);}
.card{background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 3px rgba(35,37,43,.04);}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-size:15px; font-weight:700; border-radius:8px; padding:12px 20px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  transition:background .15s, border-color .15s;
}
.btn:hover{border-color:var(--ink);}
.btn:focus-visible{outline:2px solid var(--green); outline-offset:2px;}
.btn.primary{background:var(--green); border-color:var(--green); color:#fff;}
.btn.primary:hover{background:var(--green-h);}
.btn.dark{background:var(--ink); border-color:var(--ink); color:var(--ground);}
.btn.dark:hover{background:var(--ink-hover);}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#3A2F09;}
.btn.gold:hover{filter:brightness(.96);}
.btn.goldline{background:var(--gold-t); border-color:var(--gold-tb); color:var(--gold-d);}
.btn.ghost{border:none; background:none; color:var(--t3);}
.btn.ghost:hover{color:var(--ink);}
.btn:disabled{background:var(--ground); border-color:var(--border); color:var(--t4); cursor:not-allowed;}
.btn.big{font-size:17px; padding:15px 28px;}
.btn.sm{font-size:13.5px; padding:8px 14px;}
.seg{display:flex; gap:8px;}
.seg button{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:11px 18px; font-weight:700; font-size:15px;}
.seg button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
.toggle{width:44px; height:26px; border-radius:99px; background:var(--trackoff); border:none; position:relative; transition:background .2s;}
.toggle.on{background:var(--green);}
.toggle i{position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:99px; background:#fff; transition:left .2s;}
.toggle.on i{left:21px;}
.bar{height:5px; border-radius:99px; background:var(--track); overflow:hidden;}
.bar i{display:block; height:100%; border-radius:99px; background:var(--green); transition:width .4s ease;}
.tierdots{display:flex; gap:5px;}
.tierdots i{width:9px; height:9px; border-radius:99px; background:var(--track);}
.tierdots i.lit{background:var(--gold-a);}
.empty{border:1px dashed var(--border); border-radius:10px; padding:28px 20px; text-align:center; color:var(--t3); font-size:14px;}
.empty img, .empty svg{width:72px; height:72px; margin:0 auto 10px; opacity:.82; object-fit:contain;}
.blob{object-fit:contain; display:inline-block; flex-shrink:0;}
.blob svg{width:100%; height:100%;}

/* toast */
#toast{
  position:fixed; top:16px; left:50%; transform:translateX(-50%) translateY(-90px);
  background:var(--ink); color:var(--ground); font-weight:700; font-size:14px;
  border-radius:10px; padding:12px 18px; box-shadow:0 10px 30px rgba(35,37,43,.25);
  transition:transform .3s cubic-bezier(.2,1.6,.4,1); z-index:60; text-align:center; max-width:90vw;
}
#toast.show{transform:translateX(-50%) translateY(0);}
.particle{position:fixed; width:10px; height:10px; border-radius:99px; pointer-events:none; z-index:55; animation:mmDrop .8s ease-out forwards;}
@keyframes mmDrop{0%{opacity:1; transform:translate(0,0) scale(1);}100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.3);}}
@keyframes mmPop{0%{opacity:0; transform:scale(.8);}70%{transform:scale(1.04);}100%{opacity:1; transform:scale(1);}}
.pop{animation:mmPop .3s ease;}
@keyframes mmBounce{0%,100%{transform:none;}30%{transform:translateY(-18px) scale(1.04,.96);}55%{transform:translateY(0) scale(.97,1.03);}75%{transform:translateY(-6px);}}
.mmbounce{animation:mmBounce .7s ease;}
@keyframes mmPokeA{0%{transform:rotate(0);}25%{transform:rotate(-8deg);}60%{transform:rotate(7deg);}85%{transform:rotate(-3deg);}100%{transform:rotate(0);}}
@keyframes mmPokeB{0%{transform:rotate(0);}25%{transform:rotate(-8deg);}60%{transform:rotate(7deg);}85%{transform:rotate(-3deg);}100%{transform:rotate(0);}}
.pokeA{animation:mmPokeA .5s ease;} .pokeB{animation:mmPokeB .5s ease;}
@keyframes mmFloat{0%{opacity:0; transform:translate(-50%,6px);}15%{opacity:1;}100%{opacity:0; transform:translate(-50%,-44px);}}
.kfloat{position:absolute; left:50%; top:-6px; font-weight:800; font-size:20px; color:var(--gold-d); animation:mmFloat 1s ease-out forwards; pointer-events:none; white-space:nowrap;}
@keyframes mmChip{0%,100%{transform:scale(1);}40%{transform:scale(1.14);}}
.chippop{animation:mmChip .5s ease;}
@keyframes mmPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,201,79,.55);}55%{box-shadow:0 0 0 9px rgba(232,201,79,0);}}
.pulse{animation:mmPulse 1.2s ease infinite;}
@keyframes mmDraw{to{stroke-dashoffset:0;}}
.drawarc{stroke-dasharray:300; stroke-dashoffset:300; animation:mmDraw .9s ease forwards;}

/* ---------- onboarding ---------- */
#onb, #ponb{position:fixed; inset:0; background:var(--ground); z-index:40; display:none; overflow:auto;}
#onb.on, #ponb.on{display:flex; align-items:center; justify-content:center;}
.onbcol{max-width:520px; width:92vw; padding:30px 0;}
.onbcol .hero{width:170px; height:170px; margin-bottom:18px;}
.onbcol h1{font-size:clamp(40px,6vw,52px); font-weight:800; letter-spacing:-.03em; line-height:1.02; margin:12px 0 16px;}
.onbcol .body{font-size:17px; margin-bottom:26px;}
.gradepick{display:flex; gap:10px; flex-wrap:wrap; margin:22px 0 8px;}
.gradepick button{width:70px; height:70px; border-radius:10px; border:1px solid var(--border); background:var(--surface); font-size:24px; font-weight:800; color:var(--ink);}
.gradepick button.on, .gradepick button:hover{background:var(--ink); border-color:var(--ink); color:#fff;}
.avpick{display:flex; gap:12px; flex-wrap:wrap; margin:22px 0 24px;}
.avpick button{width:104px; height:104px; border-radius:10px; border:1px solid var(--border); background:var(--surface); padding:12px;}
.avpick button.on{background:var(--gold-t); border:2px solid var(--gold);}
.avpick svg{width:100%; height:100%;}
.pgrade button{width:52px; height:52px; font-size:19px;}
.setuprow{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 18px; border-bottom:1px solid var(--border2);}
.setuprow:last-child{border-bottom:none;}
.setuprow .lbl{font-weight:700; font-size:15px;}
.setuprow .sub{font-size:13px; color:var(--t3); margin-top:3px; max-width:320px;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--surface); font-size:16px; font-weight:800; color:var(--ink);}
.stepper b{min-width:20px; text-align:center;}

/* ---------- home ---------- */
#headline{font-size:clamp(32px,4.5vw,46px); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin-bottom:24px;}
.homegrid{display:grid; grid-template-columns:1fr 320px; gap:24px;}
@media(max-width:980px){.homegrid{grid-template-columns:1fr;}}
.gstrip{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin:12px 0 24px;}
@media(max-width:760px){.gstrip{grid-template-columns:repeat(3,1fr);}}
.gcard{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 13px 12px; text-align:left; color:var(--ink); position:relative;}
.gcard .gtop{display:flex; align-items:center; justify-content:space-between;}
.gcard .gname{font-size:16px; font-weight:800;}
.gcard .gstatus{font-size:10px; font-weight:800; letter-spacing:.14em; margin-top:2px; color:var(--t3);}
.gcard .bar{margin:9px 0 7px;}
.gcard .gdetail{font-size:11.5px; color:var(--t3);}
.gcard.cur{background:var(--ink); border-color:var(--ink); color:#fff;}
.gcard.cur .gstatus{color:rgba(255,255,255,.72);}
.gcard.cur .gdetail{color:rgba(255,255,255,.72);}
.gcard.cur .bar{background:rgba(255,255,255,.22);}
.gcard.cur .bar i{background:var(--lime);}
.gcard.lock{opacity:.45;}
.gcard button{all:unset;}
.jumpcard{display:flex; align-items:center; gap:18px; padding:20px 22px; margin-bottom:24px;}
.jumpcard .blob{width:84px; height:84px; margin-left:-14px; flex-shrink:0;}
.jumpcard .jname{font-size:24px; font-weight:800; letter-spacing:-.02em;}
.jumpcard .jmeta{font-size:13.5px; color:var(--t3); margin-top:2px;}
.playbtn{position:relative; background:var(--green); color:#fff; border:none; border-radius:8px; font-size:17px; font-weight:800; letter-spacing:.06em; padding:16px 30px;}
.playbtn:hover{background:var(--green-h);}
.playbtn::after{content:''; position:absolute; left:18px; bottom:-6px; width:12px; height:12px; background:inherit; transform:rotate(45deg); border-radius:2px;}
.worlds{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media(max-width:640px){.worlds{grid-template-columns:1fr;}}
.wtile{padding:0; overflow:hidden; text-align:left; color:var(--ink); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 1px 3px rgba(35,37,43,.04); transition:transform .1s;}
.wtile:active{transform:scale(.98);}
.wwell{position:relative; height:150px; border-radius:8px; margin:8px; display:flex; align-items:center; justify-content:center;}
.wwell .blob{width:96px; height:96px;}
.wchip{position:absolute; top:10px; left:10px; background:var(--surface); border-radius:99px; padding:4px 11px; font-size:10px; font-weight:800; letter-spacing:.08em; color:#23252B; background:rgba(255,255,255,.92);}
.wtile .winfo{display:flex; align-items:center; justify-content:space-between; padding:6px 16px 14px; gap:10px;}
.wtile .wname{font-size:19px; font-weight:800; letter-spacing:-.02em; white-space:nowrap;}
.wtile .wskill{font-size:11.5px; color:var(--t4); text-transform:lowercase; font-weight:600; text-align:right; max-width:46%;}
.testcall{display:flex; align-items:center; gap:16px; background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:10px; padding:16px 18px; margin-top:20px;}
.testcall .blob{width:64px; height:64px; flex-shrink:0;}
.testcall b{font-size:17px;}
.testcall p{font-size:13.5px; color:var(--t2); margin-top:2px;}
.rail{display:flex; flex-direction:column; gap:16px;}
.railcard{padding:18px;}
.tixhead{display:flex; align-items:center; gap:12px;}
.tixhead .blob{width:54px; height:54px; margin-left:-6px;}
.tixnum{font-size:34px; font-weight:800; line-height:1;}
.tixhead .meta{margin-top:3px;}
.goldbar{height:8px; border-radius:99px; background:var(--track); overflow:hidden; margin:12px 0 8px;}
.goldbar i{display:block; height:100%; background:var(--gold); border-radius:99px; transition:width .4s;}
.wkbar{display:flex; height:8px; border-radius:99px; background:var(--track); overflow:hidden; margin:10px 0 8px;}
.wkbar .e{background:var(--green); height:100%;}
.wkbar .s{background:var(--red); height:100%;}
.wklegend{display:flex; justify-content:space-between; font-size:13px; font-weight:700;}
.wklegend .earned{color:var(--green-d);}
.wklegend .spent{color:var(--red);}
.standcard{background:var(--lime); border:none; border-radius:10px; padding:18px; color:#2A2C0E;}
.standcard .blob{width:76px; height:76px; margin:-4px 0 4px -10px; display:block;}
.standcard .kicker{color:var(--lime-d);}
.standcard b{font-size:24px; font-weight:800; letter-spacing:-.02em; display:block; margin:2px 0 6px; color:#23252B;}
.standcard p{font-size:14px; color:var(--lime-b); line-height:1.45; margin-bottom:14px;}
.runrow{display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--border2); font-size:14px;}
.runrow:last-child{border-bottom:none;}
.rundot{width:9px; height:9px; border-radius:99px; flex-shrink:0;}
.runmeta{margin-left:auto; color:var(--t3); font-size:12.5px; white-space:nowrap;}

/* ---------- play ---------- */
#scr-play{min-height:100vh; display:none; flex-direction:column;}
#scr-play.on{display:flex;}
.playtop{display:flex; align-items:center; gap:14px; padding:14px clamp(14px,2.5vw,32px);}
.xbtn{width:38px; height:38px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:15px; font-weight:800; color:var(--ink);}
.pprog{flex:1; height:6px; border-radius:99px; background:var(--track); overflow:hidden;}
.pprog i{display:block; height:100%; border-radius:99px; transition:width .4s ease;}
.coinchip{display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 13px; font-weight:800; font-size:14.5px; transition:opacity .3s;}
.sesschip{font-size:12.5px; color:var(--t3); font-weight:600; white-space:nowrap;}
.playcol{width:100%; max-width:660px; margin:0 auto; padding:6px 20px 60px; text-align:center; flex:1;}
.mascotwrap{position:relative; width:var(--mascot); height:var(--mascot); margin:4px auto 6px;}
.mascotwrap .blob{width:100%; height:100%; cursor:pointer;}
#streakline{font-size:12.5px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; transition:opacity .3s; min-height:17px;}
#streaksub{font-size:12px; color:var(--t3); margin-top:2px; min-height:15px; transition:opacity .3s;}
body.live.focuson .coinchip, body.live.focuson #streakline, body.live.focuson #streaksub{opacity:0;}
.worldchip{display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border); background:var(--surface); border-radius:99px; padding:6px 13px; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--t2); margin:12px 0 10px;}
.worldchip i{width:7px; height:7px; border-radius:99px;}
#qtext{font-size:var(--qsize); font-weight:800; letter-spacing:-.02em; line-height:1.15; text-wrap:pretty; margin:6px 0 18px;}
#qtext .fr{display:inline-flex; flex-direction:column; vertical-align:middle; margin:0 6px; line-height:1.02; font-size:.75em;}
#qtext .fr .fn{padding:0 8px;}
#qtext .fr .fd{padding:0 8px; border-top:3px solid currentColor;}
.helpers{display:flex; gap:10px; justify-content:center; margin-bottom:18px;}
.answers{display:grid; grid-template-columns:1fr 1fr; gap:12px; transition:opacity .25s;}
.answers.dim{opacity:.45;}
.ansbtn{
  background:var(--surface); border:1px solid var(--border); border-radius:10px;
  padding:var(--anspad) 12px; font-size:var(--anssize); font-weight:800; color:var(--ink);
  transition:border-color .12s, background .15s;
}
.ansbtn:hover{border-color:var(--ink);}
.ansbtn.good{background:var(--green-t); border-color:var(--green);}
.ansbtn.bad{background:var(--red-t); border-color:var(--red);}
.ansbtn .fr{display:inline-flex; flex-direction:column; vertical-align:middle; line-height:1.05; font-size:.85em;}
.ansbtn .fr .fd{border-top:2.5px solid currentColor;}
.wrongbanner{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--red-t); border:1px solid var(--red); border-radius:10px; padding:13px 16px; margin-top:14px; font-size:15px; font-weight:600; text-align:left;}
.numline{margin:8px 0 4px;}
.numline .tick{cursor:pointer;}
.sessbanner{display:flex; align-items:center; gap:14px; background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:10px; padding:14px 16px; margin-top:16px; text-align:left; font-size:14.5px;}
/* teach */
#teachconfirm, #teach{background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:10px; padding:18px; margin:14px 0; text-align:left;}
#teachconfirm b{font-size:16px;}
#teachconfirm p{font-size:14px; color:var(--t2); margin:6px 0 14px;}
.tstep{display:flex; gap:12px; align-items:flex-start; padding:7px 0; font-size:16px; line-height:1.5; transition:opacity .2s, transform .2s;}
.tstep.dim{opacity:.45; transform:scale(.96); font-size:13.5px;}
.tstep.dim svg{display:none;}
.stepnum{flex-shrink:0; width:24px; height:24px; border-radius:99px; background:var(--surface); border:2px solid var(--gold); color:var(--gold-d); font-weight:800; font-size:12px; display:flex; align-items:center; justify-content:center; margin-top:2px;}
.tstep .fr{display:inline-flex; flex-direction:column; vertical-align:middle; margin:0 3px; line-height:1.05; font-size:14px;}
.tstep .fr .fd{border-top:2px solid currentColor;}
.vizrow{display:flex; align-items:center; gap:8px; margin-top:7px;}
.vizrow svg{flex:1; min-width:0;}

/* ---------- end / test screens ---------- */
.fullcol{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 20px;}
.fullcol .blob{width:150px; height:150px; margin-bottom:8px;}
.fullcol h1{font-size:clamp(40px,6vw,56px); font-weight:800; letter-spacing:-.03em; line-height:1.05; margin:10px 0 8px;}
.fullcol .body{max-width:460px; margin-bottom:22px;}
.statrow{display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; justify-content:center;}
.statcard{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px 22px; min-width:130px;}
.statcard b{font-size:30px; font-weight:800; display:block; line-height:1;}
.statcard span{font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--t3); text-transform:uppercase;}
.tixbanner{display:inline-flex; align-items:center; gap:10px; background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:10px; padding:12px 18px; font-weight:700; font-size:15px; margin-bottom:22px;}
.testworlds{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0 26px; width:100%; max-width:560px;}
.testworld{display:flex; align-items:center; gap:12px; border-radius:10px; padding:12px 14px; text-align:left;}
.testworld .blob{width:44px; height:44px; margin:0;}
.testworld b{font-size:15px;}
.testworld span{font-size:12px; color:var(--t2);}

/* ---------- shop ---------- */
.shophead{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.shophead .blob{width:82px; height:82px; margin-left:-10px;}
.tabs{display:flex; gap:8px; margin-bottom:20px;}
.tabs button{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:99px; padding:9px 18px; font-weight:700; font-size:14px;}
.tabs button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
.shopgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media(max-width:760px){.shopgrid{grid-template-columns:1fr 1fr;}}
.item{border-radius:10px; padding:8px; background:var(--track);}
.item.owned{background:var(--green-t);}
.iteminner{background:var(--surface); border-radius:8px; padding:16px; text-align:center; height:100%;}
.iteminner .icon{font-size:34px; height:46px; display:flex; align-items:center; justify-content:center;}
.iteminner .icon svg{width:44px; height:44px;}
.tagpill{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.08em; border-radius:99px; padding:3px 10px; margin:8px 0 6px;}
.tagpill.lime{background:var(--lime); color:var(--lime-d);}
.tagpill.pink{background:var(--w-frac); color:#7C2B52;}
.tagpill.gray{background:var(--track); color:var(--t3);}
.iteminner .iname{font-weight:800; font-size:15px; margin-bottom:10px;}

/* ---------- rewards ---------- */
.rewgrid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
@media(max-width:820px){.rewgrid{grid-template-columns:1fr;}}
.feerow{display:flex; justify-content:space-between; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border2); font-size:14px;}
.feerow:last-child{border-bottom:none;}
.feerow b{color:var(--gold-d); white-space:nowrap;}
.redrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 2px; border-bottom:1px solid var(--border2);}
.redrow:last-child{border-bottom:none;}
.redrow .rname{font-weight:700; font-size:15px;}
.redrow .rcost{font-size:13px; color:var(--t3);}
.waitrow{display:flex; align-items:center; justify-content:space-between; background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:8px; padding:11px 14px; margin-bottom:8px; font-size:14px; font-weight:600;}

/* ---------- stand ---------- */
.standgrid{display:grid; grid-template-columns:1fr 1.15fr; gap:20px;}
@media(max-width:860px){.standgrid{grid-template-columns:1fr;}}
.ledrow{display:flex; justify-content:space-between; padding:9px 2px; border-bottom:1px solid var(--border2); font-size:15px;}
.ledrow b.pos{color:var(--green-d);} .ledrow b.neg{color:var(--red);}
.mathbox{background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:8px; padding:14px 16px; margin-top:14px; font-size:14px; line-height:1.6;}
.forecast{display:flex; align-items:center; gap:9px; background:var(--ground); border-radius:8px; padding:11px 14px; font-weight:700; font-size:14.5px; margin:16px 0;}
.forecast i{width:9px; height:9px; border-radius:99px;}

/* ---------- grown-ups ---------- */
.pargrid{display:grid; grid-template-columns:1.2fr 1fr; gap:22px;}
@media(max-width:900px){.pargrid{grid-template-columns:1fr;}}
.parh{font-size:15px; font-weight:800; margin:20px 0 10px;}
.parh:first-child{margin-top:0;}
.pgradebtns{display:flex; gap:8px; flex-wrap:wrap;}
.pgradebtns button{width:52px; height:52px; border-radius:8px; border:1px solid var(--border); background:var(--surface); font-size:18px; font-weight:800; color:var(--ink);}
.pgradebtns button.on{background:var(--ink); border-color:var(--ink); color:#fff;}
.accrow{display:flex; align-items:center; gap:12px; margin-bottom:10px; font-size:13.5px;}
.accrow .albl{width:130px; font-weight:700; color:var(--t2); flex-shrink:0;}
.accrow .bar{flex:1; height:8px;}
.accrow .aval{width:82px; text-align:right; font-weight:800; font-size:12.5px; flex-shrink:0;}
.focusrow{display:flex; align-items:center; gap:10px; background:var(--gold-t); border:1px solid var(--gold-tb); border-radius:8px; padding:10px 14px; margin-bottom:8px; font-size:14px;}
.focusrow i{width:8px; height:8px; border-radius:99px; background:var(--orange); flex-shrink:0;}
table.sk{width:100%; border-collapse:collapse; font-size:13px;}
table.sk th{color:var(--t3); font-size:10.5px; text-align:left; padding:5px 6px; text-transform:uppercase; letter-spacing:.06em;}
table.sk td{padding:8px 6px; border-top:1px solid var(--border2);}
table.sk td:last-child, table.sk th:last-child{text-align:right;}
.lowacc{color:var(--red); font-weight:800;}
.inp{font-family:inherit; font-size:14px; font-weight:600; color:var(--ink); background:var(--ground); border:1px solid var(--border); border-radius:8px; padding:9px 11px; outline:none;}
.inp:focus-visible{outline:2px solid var(--green);}
.sel{width:100%; margin-top:8px; font-family:inherit; font-size:13.5px; font-weight:600; color:var(--ink); background:var(--ground); border:1px solid var(--border); border-radius:8px; padding:10px 12px;}
.setrow{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 2px; border-bottom:1px solid var(--border2);}
.setrow:last-child{border-bottom:none;}
.backlink{display:inline-block; margin-top:24px; font-size:14px; color:var(--t3); background:none; border:none; text-decoration:underline;}

</style>
</head>

/* ================= utils ================= */
const $ = id => document.getElementById(id);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const gcd = (a,b) => { a=Math.abs(a); b=Math.abs(b); while(b){[a,b]=[b,a%b];} return a||1; };
function simp(n,d){ const g=gcd(n,d); return [n/g, d/g]; }
function frH(n,d){
  if(d===1) return String(n);
  return `<span class="fr"><span class="fn">${n}</span><span class="fd">${d}</span></span>`;
}
function sfrH(n,d){ const [a,b]=simp(n,d); return frH(a,b); }
function fmt(x){
  if(typeof x!=='number') return String(x);
  return (Math.round(x*1000)/1000).toString();
}
/* CRA visuals: representational pictures for the teach steps */
function numLineSVG(from, to){
  const lo = Math.min(from, to, 0)-1, hi = Math.max(from, to, 0)+1;
  const range = hi-lo, step = range>30?10 : range>14?5 : 1;
  const W=280, H=48, y=30;
  const x = v => 10 + (v-lo)/range*(W-20);
  let marks='';
  for(let v=Math.ceil(lo/step)*step; v<=hi; v+=step){
    marks += `<line x1="${x(v)}" y1="${y-4}" x2="${x(v)}" y2="${y+4}" stroke="currentColor" stroke-width="1" opacity=".45"/>`;
  }
  for(const v of [...new Set([0, from, to])]){
    marks += `<text x="${x(v)}" y="${y+16}" font-size="10" text-anchor="middle" fill="currentColor" font-weight="${v===to?'800':'500'}" opacity="${v===to?'1':'.75'}">${v}</text>`;
  }
  const mid = (x(from)+x(to))/2;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; max-width:280px; display:block; margin-top:6px;">
    <line x1="6" y1="${y}" x2="${W-6}" y2="${y}" stroke="currentColor" stroke-width="1.5" opacity=".65"/>
    ${marks}
    <path d="M ${x(from)} 16 Q ${mid} 2 ${x(to)} 16" fill="none" stroke="#ffc12e" stroke-width="2"/>
    <path d="M ${x(to)} 16 l ${to>from?-5:5} -4 m ${to>from?5:-5} 4 l ${to>from?-2:2} -6" fill="none" stroke="#ffc12e" stroke-width="2"/>
    <circle cx="${x(from)}" cy="${y}" r="4" fill="#59a7ff"/>
    <circle cx="${x(to)}" cy="${y}" r="4" fill="#2db56c"/>
  </svg>`;
}
function fracBar(n, d, color){
  const W=200, H=24, cw=(W-4)/d;
  let cells='';
  for(let i=0;i<d;i++){
    cells += `<rect x="${2+i*cw+1}" y="2" width="${Math.max(1,cw-2)}" height="${H-4}" rx="3" fill="${i<n?(color||'#59a7ff'):'transparent'}" stroke="currentColor" stroke-width="1" opacity="${i<n?'1':'.35'}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">${cells}</svg>`;
}
const vizRow = (...parts) => `<span class="vizrow">${parts.join('')}</span>`;


/* ================= audio ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, dur, type, vol, when){
  const c = ac(); if(!c || !S.sound) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'square'; o.frequency.value = freq;

function pctSteps(p, base, ans){
  if(p===50) return [`50% means <b>half</b>.`, `Half of ${base} is <b>${fmt(ans)}</b>.`];
  if(p===25) return [`25% means a <b>quarter</b> — divide by 4.`, `${base} ÷ 4 = <b>${fmt(ans)}</b>.`];
  if(p===75) return [`75% is <b>three quarters</b>.`, `A quarter: ${base} ÷ 4 = ${base/4}.`, `Three of them: ${base/4} × 3 = <b>${fmt(ans)}</b>.`];
  if(p===5)  return [`Start with 10%: slide the decimal → ${fmt(base/10)}.`, `5% is half of that: <b>${fmt(ans)}</b>.`];
  if(p===15) return [`10% of ${base} is ${fmt(base/10)}. 5% is half of that: ${fmt(base/20)}.`, `15% = 10% + 5% = ${fmt(base/10)} + ${fmt(base/20)} = <b>${fmt(ans)}</b>.`];
  if(p%10===0) return [`10% of ${base} is ${fmt(base/10)} — just slide the decimal.`, `${p}% is ${p/10} of those: ${p/10} × ${fmt(base/10)} = <b>${fmt(ans)}</b>.`];
  return [`${p}% means ${p} out of 100.`, `${p} ÷ 100 × ${base} = <b>${fmt(ans)}</b>.`];
}

function boxMul(){

  return Q('Find the mystery number', `▢ × ${a} = ${a*x}`, x, [a*x-a, x+1, a===x?a+2:a].filter(v=>v!==x), 'Missing numbers (×)', [
    `Something × ${a} makes ${a*x}.`,
    `Work backwards with division: ${a*x} ÷ ${a} = <b>${x}</b>.`,
    `Check: ${x} × ${a} = ${a*x} ✓`]);
}
function powersG(){
  const kind=pick([1,1,2,3]);
  if(kind===1){ const n=ri(2,12); return Q('Exponents', `${n}<sup>2</sup> = ?`, n*n, [n*2, n*n+n, (n+1)*(n+1)].filter(x=>x!==n*n), 'Exponents', [
    `${n}<sup>2</sup> means ${n} × ${n} — NOT ${n} × 2.`,
    `${n} × ${n} = <b>${n*n}</b>.`]); }
  if(kind===2){ const n=ri(2,5); return Q('Exponents', `${n}<sup>3</sup> = ?`, n*n*n, [n*3, n*n, n*n*n+n].filter(x=>x!==n*n*n), 'Exponents', [
    `${n}<sup>3</sup> means ${n} × ${n} × ${n}.`,
    `${n} × ${n} = ${n*n}, then × ${n} again = <b>${n*n*n}</b>.`]); }
  const k=ri(3,6), ans=Math.pow(2,k);
  return Q('Exponents', `2<sup>${k}</sup> = ?`, ans, [2*k, ans/2, ans*2].filter(x=>x!==ans), 'Exponents', [
    `2<sup>${k}</sup> means multiply 2 by itself ${k} times.`,
    `Keep doubling: ${Array.from({length:k},(_,i)=>Math.pow(2,i+1)).join(' → ')}.`,
    `<b>${ans}</b>.`]);
}
function sqrootG(){
  const n=ri(2,15);
  return Q('Square roots', `√${n*n} = ?`, n, [n+1, n-1||n+2, Math.round(n*n/2)].filter(x=>x!==n), 'Square roots', [
    `√ asks: what number × itself makes ${n*n}?`,
    `${n} × ${n} = ${n*n}.`,
    `So √${n*n} = <b>${n}</b>.`]);
}
function sciNotG(){
  const M=ri(11,89), k=ri(2,5), N=M*Math.pow(10,k-1);
  return Q('Scientific notation', `${N} = ${fmt(M/10)} × 10<sup>?</sup>`, k, [k-1, k+1, k+2], 'Scientific notation', [
    `Count how many places the decimal moves from ${fmt(M/10)} to reach ${N}.`,
    `${fmt(M/10)} → ${N}: it moves ${k} places right.`,
    `So the power is <b>${k}</b>.`]);
}
function combineLikeG(){
  const a=ri(2,9), b=ri(2,9), c=ri(1,a+b-2), v=a+b-c;
  const dx = n => n===1? 'x' : n+'x';
  return Q('Combine like terms', `${a}x + ${b}x − ${c}x = ?`, dx(v), [dx(v+1), dx(v-1), (a+b+c)+'x'].filter(x=>x!==dx(v)), 'Combining like terms', [
    `They're all "x" terms, so just combine the numbers in front.`,
    `${a} + ${b} − ${c} = ${v}.`,
    `Answer: <b>${dx(v)}</b>.`]);
}
function multiStepG(){
  let x; do{ x=ri(-6,9); }while(x===0);
  const a=ri(3,7), c=ri(1,a-2), b=ri(1,9), d=(a-c)*x+b;
  return Q('Solve for x', `${a}x + ${b} = ${c}x ${d<0?'−':'+'} ${Math.abs(d)}`, 'x = '+x,
    ['x = '+(-x), 'x = '+(x+1), 'x = '+(d-b)].filter(s=>s!=='x = '+x), 'Equations with x on both sides', [
    `Get the x's together: subtract ${c}x from both sides → ${a-c}x + ${b} = ${dspN(d)}.`,
    `Subtract ${b}: ${a-c}x = ${dspN(d-b)}.`,
    `Divide by ${a-c}: x = <b>${dspN(x)}</b>.`]);
}
function slope2G(){
  let m; do{ m=ri(-4,4); }while(m===0);
  const x1=ri(-5,5), dx=ri(1,4), y1=ri(-5,5), x2=x1+dx, y2=y1+m*dx;
  return Q('Find the slope', `(${x1}, ${y1}) and (${x2}, ${y2})`, m, [-m, m+1, dx===m?m-1:dx].filter(v=>v!==m), 'Slope', [
    `Slope = rise ÷ run (how far UP per step RIGHT).`,
    `Rise: ${dspN(y2)} − ${dspP(y1)} = ${dspN(y2-y1)}. &nbsp;Run: ${x2} − ${dspP(x1)} = ${dx}.`,
    `${dspN(y2-y1)} ÷ ${dx} = <b>${dspN(m)}</b>.`]);
}

/* ================= adaptive engine (per grade + topic) ================= */
const tKey = t => S.grade+'_'+t;
const tierOf = t => S.tiers2[tKey(t)]||1;
const topicMeta = t => GRADE_WORLDS[S.grade][t];
function gameLabel(topic){
  const W = topicMeta(topic);
  return `${W.name} · Grade ${S.grade} · Tier ${tierOf(topic)}`;
}
function recordAdaptive(topic, correct){
  const k = tKey(topic);
  const r = S.recent2[k] = S.recent2[k]||[];
  r.push(correct?1:0);
  if(r.length>6) r.shift();
  if(r.length===6){
    const c = r.reduce((s,v)=>s+v,0);
    const t = tierOf(topic);
    if(c>=5 && t<3){
      S.tiers2[k]=t+1; S.recent2[k]=[];
      sfx.tierup();
      toast(`Tier ${t+1} unlocked — Kredits pay more now`, 2400);
      if(G) refreshTopicChip(topic);
      ensureTk();
      if(S.tk.tierUps<2 && S.grade===unlockedUpTo()){ S.tk.tierUps++; awardT(1, 'tier up'); }
    } else if(c<=2 && t>1){
      S.tiers2[k]=t-1; S.recent2[k]=[];
      if(G) refreshTopicChip(topic);
    }
  }
}
function makeProblem(topic, forceTier){
  let tier = forceTier || tierOf(topic);
  if(!forceTier && tier>1 && Math.random()<0.2) tier--;   // sprinkle easier wins
  const gens = CURRICULUM[S.grade][topic][tier];
  for(let tries=0; tries<10; tries++){
    try{
      const p = pick(gens)();
      const av = valOf(p.ans);
      let wrongs = [];
      for(const w of new Set(p.wrongs)){
        if(w===p.ans) continue;
        const wv = valOf(w);
        if(av!==null && wv!==null && Math.abs(av-wv)<1e-9) continue;   // a distractor must never EQUAL the answer in value
        if(wv!==null && wrongs.some(x=>{const xv=valOf(x); return xv!==null && Math.abs(xv-wv)<1e-9;})) continue;
        wrongs.push(w);
      }
      let guard = 0;
      while(wrongs.length<3 && guard++<20){
        const numAns = parseFloat(String(p.ans).replace('x = ','').replace('$','').replace('%',''));
        if(!isNaN(numAns) && !/</.test(p.ans)){
          const alt = String(p.ans).replace(/-?[\d.]+/, fmt(numAns + pick([-3,-2,2,3,4])));
          if(alt!==p.ans && !wrongs.includes(alt)) wrongs.push(alt);
        } else break;
      }
      wrongs = wrongs.slice(0,3);
      if(wrongs.length<2) continue;
      const choices = shuffle([p.ans, ...wrongs]);
      return {...p, tier, choices, correctIdx: choices.indexOf(p.ans)};
    }catch(e){ /* regenerate */ }
  }
  const a=ri(2,9), b=ri(2,9);
  const ans=String(a+b);
  const choices = shuffle([ans, String(a+b+1), String(a+b-1), String(a*b)]);
  return {prompt:'Add', q:`${a} + ${b}`, ans, skill:'Arithmetic', tier:1, choices, correctIdx:choices.indexOf(ans)};
}


/* ================= tickets (real-world rewards) =================
   Earned ONLY from effort milestones — never per answer — so there's
   nothing to grind. Weekly cap keeps the cost predictable. */
let roundTk = 0;
const todayStr = () => new Date().toISOString().slice(0,10);
const weekStr = () => String(Math.floor((Date.now()/86400000 + 3)/7));   // stable week bucket (starts Monday)
function ensureTk(){
  const d = todayStr(), w = weekStr();
  if(S.tk.day!==d){ S.tk.day=d; S.tk.dayPlay=false; S.tk.dayAcc=false; S.tk.tierUps=0; }
  if(S.tk.week!==w){ S.tk.week=w; S.tk.weekEarned=0; S.tk.weekDays=[]; S.tk.weekStreakGiven=false; }
}
function unlockedUpTo(){
  let u = S.maxG || S.grade;
  for(let g=3; g<8; g++) if(S.passed[g]) u = Math.max(u, g+1);
  return Math.min(8, u);
}
function awardT(n, why, bypassCap){
  ensureTk();
  const room = bypassCap ? n : Math.max(0, (S.tk.weekCap||10) - S.tk.weekEarned);
  const give = Math.min(n, room);
  if(give<=0){ toast('weekly ticket max reached — resets monday', 2000); return 0; }
  S.tickets += give; S.tk.weekEarned += give; roundTk += give;
  S.tkLog.unshift({d:todayStr(), why, n:give});
  if(S.tkLog.length>30) S.tkLog.length = 30;
  toast(`+${give} ticket${give>1?'s':''} — ${why}`, 2200);
  sfx.milestone();
  save();
  return give;
}

const canSpeak = ('speechSynthesis' in window);
function speakify(html){
  let t = String(html);
  t = t.replace(/<span class="fr"><span class="fn">(.*?)<\/span><span class="fd">(.*?)<\/span><\/span>/g, ' $1 over $2 ');
  t = t.replace(/<br\s*\/?>/g, '. ');
  t = t.replace(/<sup>(\d+)<\/sup>/g, ' to the power of $1 ');
  t = t.replace(/<[^>]+>/g, '');
  t = t.replace(/&nbsp;/g, ' ');
  t = t.replace(/\|\s*([^|]+?)\s*\|/g, ' the absolute value of $1 ');
  t = t.replace(/√/g, ' the square root of ');
  t = t.replace(/▢/g, ' the box ');
  t = t.replace(/(\d) r (\d)/g, '$1 remainder $2');
  t = t.replace(/\$(\d+(?:\.\d+)?)/g, '$1 dollars');
  t = t.replace(/(\d)\s*:\s*(\d)/g, '$1 to $2');
  t = t.replace(/=\s*\?/g, ' equals what');
  t = t.replace(/−/g, ' minus ');
  t = t.replace(/(^|[\s(=])-(\d)/g, '$1negative $2');
  t = t.replace(/×/g, ' times ');
  t = t.replace(/÷/g, ' divided by ');
  t = t.replace(/=/g, ' equals ');
  t = t.replace(/[✓✔]/g, ' — checks out!');
  t = t.replace(/PEMDAS/g, 'pem-dass');
  t = t.replace(/[⛏️🔥⬆️→💎🪙]/g, ' ');
  return t.replace(/\s+/g,' ').trim();
}
/* voice quality ranking: browsers hide their best voices behind the default one */
let VOICES = [];
function scoreVoice(v){
  const n = v.name.toLowerCase();
  if(!/^en/i.test(v.lang)) return -1;
  let s = /en[-_]us/i.test(v.lang) ? 20 : 8;
  if(/natural/.test(n)) s += 100;                                    // Edge neural voices — best free option
  if(/google/.test(n)) s += 50;                                      // Chrome network voices
  if(/premium|enhanced|neural/.test(n)) s += 40;                     // Apple enhanced voices
  if(/samantha|ava|allison|zoe|joelle/.test(n)) s += 35;             // good Apple defaults
  if(/aria|jenny|michelle|emma|ana|sonia|libby/.test(n)) s += 15;    // good Microsoft names
  if(/online/.test(n)) s += 10;
  if(/female/.test(n)) s += 5;
  if(/compact|espeak|flite|robo/.test(n)) s -= 50;                   // the robotic ones
  return s;
}
function refreshVoices(){
  try{
    VOICES = speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    VOICES.sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  }catch(e){ VOICES = []; }
}
if(canSpeak){ refreshVoices(); speechSynthesis.onvoiceschanged = refreshVoices; }
function currentVoice(){
  if(!VOICES.length) refreshVoices();
  if(S.voiceName){ const v = VOICES.find(v=>v.name===S.voiceName); if(v) return v; }
  return VOICES[0] || null;
}
function speak(text){
  if(!canSpeak || !text) return;
  try{
    speechSynthesis.cancel();
    const v = currentVoice();
    // one utterance per sentence: natural pacing + sidesteps Chrome's long-utterance cutoff
    const chunks = (String(text).match(/[^.!?]+[.!?]*/g) || [String(text)]).map(c=>c.trim()).filter(Boolean);
    for(const c of chunks){
      const u = new SpeechSynthesisUtterance(c);
      if(v) u.voice = v;
      u.rate = 0.95; u.pitch = 1.03;
      speechSynthesis.speak(u);
    }
  }catch(e){}
}
function stopSpeak(){ if(canSpeak){ try{ speechSynthesis.cancel(); }catch(e){} } }

  midnight:{name:'Midnight', c:'#17181B', cost:800}, blossom:{name:'Blossom', c:'#F0AFCE', cost:1200},
  mint:{name:'Mint', c:'#7CBF8B', cost:2000}
};
function bonusPct(){
  let g = 0;
  for(const k of S.owned.gear) g = Math.max(g, GEAR[k].bonus);
  let p = 0;
  for(const k of S.owned.pets) p += PETS[k].bonus;
  return g + p;
}

/* ---------- theme / band / focus ---------- */
function applyBand(){
  document.body.classList.remove('band-a','band-c');
  if(S.grade<=4) document.body.classList.add('band-a');
  else if(S.grade>=7) document.body.classList.add('band-c');
}
function applyTheme(){
  document.body.classList.forEach(c=>{ if(c.startsWith('theme-')) document.body.classList.remove(c); });
  document.body.classList.add('theme-'+(THEMES[S.theme]?S.theme:'paper'));
  document.body.classList.toggle('focuson', !!S.focusMode);
  applyBand();
}

/* ---------- weekly earned/spent ---------- */
function ensureWk(){
  const k = weekStr();
  if(S.wk.key!==k){ S.wk = {key:k, earned:0, spent:0}; }
}
function wkEarn(n){ ensureWk(); S.wk.earned += n; }
function wkSpend(n){ ensureWk(); S.wk.spent += n; }

/* ---------- router ---------- */
const SCREENS = {home:'scr-home', play:'scr-play', end:'scr-end', testintro:'scr-testintro', testresult:'scr-testresult', shop:'scr-shop', rewards:'scr-rewards', stand:'scr-stand', parent:'scr-parent'};
const CHROMELESS = new Set(['play','end','testresult']);
let screenNow = 'home';
function go(name){
  screenNow = name;
  for(const [n,id] of Object.entries(SCREENS)) $(id).classList.toggle('on', n===name);
  document.body.classList.toggle('chromeless', CHROMELESS.has(name));
  document.querySelectorAll('.navitem').forEach(b=>b.classList.toggle('on', b.dataset.nav===name || (name==='home'&&b.dataset.nav==='home')));
  window.scrollTo(0,0);
  renderNav();
}
document.querySelectorAll('.navitem').forEach(b=>b.onclick = ()=>{
  const n = b.dataset.nav;
  if(G) abandonRound();
  if(n==='home') renderHome();
  else if(n==='shop') renderShop();
  else if(n==='rewards') renderRewards();
  else if(n==='stand') renderStand();
  else if(n==='parent'){ if(!S.parentOnboarded){ startParentOnb(); return; } renderParent(); }
  go(n);
});
$('nav-brand').onclick = ()=>{ if(G) abandonRound(); renderHome(); go('home'); };
$('kbal').onclick = ()=>{ if(G) abandonRound(); renderShop(); go('shop'); };
function renderNav(){
  $('kcount').textContent = fmtK(S.gems);
  ensureTk();
  $('weekchip').textContent = `${S.tk.weekDays.length}-day week`;
  const av = $('avchip');
  av.innerHTML = S.pet ? `<span style="font-size:24px; display:flex; align-items:center; justify-content:center; height:100%;">${PETS[S.pet].icon}</span>` : (ILLOS[S.avatar]||ILLOS.thinker);
}

/* ---------- home ---------- */

  applyTheme(); ensureWk(); ensureTk();
  $('headline').textContent = S.wk.earned>0 ? `${fmtK(S.wk.earned)} Kredits this week.` : 'Nothing earned yet. Lock in.';
  // grade strip
  const topG = unlockedUpTo();
  $('gstrip').innerHTML = [3,4,5,6,7,8].map(g=>{
    const passed = !!S.passed[g], cur = g===S.grade, locked = g>topG;
    let status, bar, detail, mark='';
    if(passed && !cur){ status='PASSED'; bar=100; detail='test passed'; mark=IC.check; }
    else if(cur){
      const n = worldsAtT2();
      status='CURRENT'; bar=Math.round(n/4*100); detail = passed ? 'test passed' : (n>=4?'test ready':`${n}/4 worlds ready`);
    } else if(locked){ status='LOCKED'; bar=0; detail=`after grade ${g-1}`; mark=IC.lock; }

      <div class="gtop"><span class="gname">Grade ${g}</span><span>${mark}</span></div>
      <div class="gstatus">${status}</div>

      <div class="gdetail">${detail}</div></button>`;

  const runs = S.stats.sessions.slice(-5).reverse();
  $('recentruns').innerHTML = runs.length ? runs.map(r=>`
    <div class="runrow"><i class="rundot" style="background:${WORLD[r.t]?WORLD[r.t].color:'#B5B0A4'};"></i>
      ${WORLD[r.t]?WORLD[r.t].name:'—'}<span class="runmeta">${r.c}/${r.c+r.w} · +${fmtK(r.k||0)} K</span></div>`).join('')
    : `<div class="empty">${ILLOS.coffee}Nothing yet. Your first run goes here.</div>`;
  renderNav();
}

/* ---------- play ---------- */
let G = null, pendT = null, idleT = null, sessInt = null;
function ensurePlayDay(){
  const d = todayStr();
  if(S.playMs.day!==d){ S.playMs = {day:d, ms:0, bannered:false}; }
}
function startRound(topic, opts={}){
  ac();
  S.lastTopic = topic; save();
  const total = opts.quick ? 6 : 12;
  G = {topic, quick:!!opts.quick, total, qNum:0, correct:0, wrong:0, streak:0, best:0, k:0,
       fixed:0, comeback:false, sawWrong:false, queue:[], phase:'main', cur:null, locked:false,
       helpedThis:false, confirmedThis:false, helpCount:0, start:Date.now(), done:false};
  $('g-topic').innerHTML = `<i style="background:${WORLD[topic].color};"></i>${WORLD[topic].name} · Grade ${S.grade} · Tier ${tierOf(topic)}`;
  $('p-k').textContent = fmtK(S.gems);
  $('mascot').innerHTML = ILLOS[WORLD[topic].blob];
  let pk = false;
  $('mascot').onclick = ()=>{ const m=$('mascot'); m.classList.remove('pokeA','pokeB'); void m.offsetWidth; m.classList.add(pk?'pokeA':'pokeB'); pk=!pk; };
  $('pprog').style.background = WORLD[topic].color;
  $('sessbanner').innerHTML = '';
  clearInterval(sessInt);
  ensurePlayDay();
  sessInt = setInterval(()=>{
    if(!G || screenNow!=='play') return;
    S.playMs.ms += 1000;
    updateSessChip();
    if(S.sessionLen>0 && S.playMs.ms >= S.sessionLen*60000 && !S.playMs.bannered){
      S.playMs.bannered = true; save();
      $('sessbanner').innerHTML = `<div class="sessbanner pop"><span style="font-size:20px;">🌤</span>
        <div style="flex:1;">That's your math for today. Finish this one, then go move around.</div>
        <button class="btn sm dark" id="btn-sessdone">Done for now</button></div>`;
      $('btn-sessdone').onclick = ()=>endRound();
    }
  }, 1000);
  updateSessChip();
  go('play');
  nextQ();
}
function updateSessChip(){
  const el = $('sesschip');
  if(S.sessionLen>0){
    const left = Math.max(0, Math.ceil((S.sessionLen*60000 - S.playMs.ms)/60000));
    el.textContent = `${left} min left`;
  } else el.textContent = '';
}
function abandonRound(){
  clearTimeout(pendT); clearTimeout(idleT); clearInterval(sessInt);
  stopSpeak(); G = null;
  document.body.classList.remove('live');
}
function updateStreakline(){
  if(!G) return;
  const {cur, next} = streakInfo(G.streak);
  const m = comboMult(G.streak);
  $('streakline').innerHTML = G.phase==='second'
    ? `<span style="color:var(--gold-d);">SECOND LOOK · FIX YOUR MISSES</span>`
    : `<span style="color:${cur.c};">${cur.name}${G.streak>0?` · ${G.streak} STREAK`:''}${m>1?` · ×${m}`:''}</span>`;
  $('streaksub').textContent = (G.phase==='main' && next) ? `${next.min-G.streak} more to ${next.name}` : '';
}
function nextQ(){
  if(!G) return;
  clearTimeout(pendT); clearTimeout(idleT);
  stopSpeak();
  $('wrongbox').innerHTML = ''; $('teach').classList.add('hide'); $('teachconfirm').classList.add('hide');
  $('answers').classList.remove('dim');
  if(G.phase==='main' && G.qNum>=G.total){
    if(G.queue.length){ G.phase='second'; }
    else { endRound(); return; }
  }
  if(G.phase==='second' && !G.queue.length){ endRound(); return; }
  G.cur = G.phase==='second' ? G.queue.shift() : makeProblem(G.topic);
  G.locked = false; G.helpedThis = false; G.confirmedThis = false;
  const done = G.phase==='second' ? G.total : G.qNum;
  $('pprog').style.width = Math.round(done/G.total*100)+'%';
  updateStreakline();
  document.body.classList.add('live');
  renderQuestion();
  idleT = setTimeout(()=>{ if(G && !G.locked) $('btn-teach').classList.add('pulse'); }, 25000);
}
function renderQuestion(){
  $('qtext').innerHTML = G.cur.q;
  $('btn-teach').classList.remove('pulse');
  $('btn-teach').innerHTML = `${IC.bulb} Teach me · costs half`;
  $('btn-sayq').innerHTML = `${IC.speaker} Read it`;
  $('helpers').style.display = G.test ? 'none' : '';
  const nl = G.cur.nl && !G.test;
  $('answers').style.display = nl ? 'none' : '';
  $('numlinebox').innerHTML = '';
  if(nl){ renderNumline(); return; }
  $('answers').innerHTML = G.cur.choices.map((c,i)=>`<button class="ansbtn" data-i="${i}">${c}</button>`).join('');
  $('answers').querySelectorAll('[data-i]').forEach(b=>b.onclick = ()=>answer(+b.dataset.i));
}
function renderNumline(){
  const v = valOf(G.cur.ans), from = G.cur.nl.from;
  let lo = Math.min(from, v, 0)-2, hi = Math.max(from, v, 0)+2;
  if(hi-lo>26){ $('answers').style.display=''; $('answers').innerHTML = G.cur.choices.map((c,i)=>`<button class="ansbtn" data-i="${i}">${c}</button>`).join(''); $('answers').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>answer(+b.dataset.i)); return; }
  const W=620, H=86, y=46, x = n => 20 + (n-lo)/(hi-lo)*(W-40);
  let ticks='';
  for(let n=lo;n<=hi;n++){
    ticks += `<g class="tick" data-v="${n}"><rect x="${x(n)-10}" y="${y-22}" width="20" height="44" fill="transparent"/><line x1="${x(n)}" y1="${y-7}" x2="${x(n)}" y2="${y+7}" stroke="#8A8578" stroke-width="${n===0?2.4:1.4}"/>${(n===0||n===from||n%5===0)?`<text x="${x(n)}" y="${y+24}" text-anchor="middle" font-size="12" font-weight="${n===from?'800':'500'}" fill="${n===from?'#5E9FE0':'#8A8578'}">${n}</text>`:''}</g>`;
  }
  $('numlinebox').innerHTML = `<div class="numline card" style="padding:14px;">
    <div class="meta" style="margin-bottom:4px;">Tap where you land. Start is marked.</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto;" id="nlsvg">
      <line x1="12" y1="${y}" x2="${W-12}" y2="${y}" stroke="#B5B0A4" stroke-width="2"/>
      ${ticks}
      <circle cx="${x(from)}" cy="${y}" r="6" fill="#5E9FE0"/>
      <text x="${x(from)}" y="${y-14}" text-anchor="middle" font-size="10" font-weight="800" fill="#5E9FE0">START</text>
    </svg></div>`;
  document.querySelectorAll('#nlsvg .tick').forEach(t=>{
    t.addEventListener('click', ()=>{
      if(!G || G.locked) return;
      const tapped = +t.dataset.v;
      const line = t.querySelector('line');
      if(tapped===v){ line.setAttribute('stroke', '#58B372'); line.setAttribute('stroke-width','4'); resolveAnswer(true, String(tapped)); }
      else {
        line.setAttribute('stroke', '#E4766C'); line.setAttribute('stroke-width','4');
        const ct = document.querySelector(`#nlsvg .tick[data-v="${v}"] line`);
        if(ct){ ct.setAttribute('stroke', '#58B372'); ct.setAttribute('stroke-width','4'); }
        resolveAnswer(false, String(tapped));
      }
    });
  });
}
function answer(i){
  if(!G || G.locked) return;
  const correct = i===G.cur.correctIdx;
  const btns = $('answers').querySelectorAll('.ansbtn');
  btns[i].classList.add(correct?'good':'bad');
  if(!correct && btns[G.cur.correctIdx]) btns[G.cur.correctIdx].classList.add('good');
  resolveAnswer(correct);
}
function resolveAnswer(correct){
  G.locked = true;
  clearTimeout(idleT); $('btn-teach').classList.remove('pulse');
  stopSpeak();
  document.body.classList.remove('live');
  const primary = G.phase==='main';
  if(primary) G.qNum++;
  // stats (primary only)
  if(primary && !G.test){
    const sk = S.stats.skills[G.cur.skill] = S.stats.skills[G.cur.skill]||{c:0,w:0,h:0,topic:G.topic};
    const tp = S.stats.topics[tKey(G.topic)] = S.stats.topics[tKey(G.topic)]||{c:0,w:0};
    if(G.helpedThis){ sk.h=(sk.h||0)+1; G.helpCount++; }
    if(correct){ sk.c++; tp.c++; } else { sk.w++; tp.w++; }
    if(!G.helpedThis) recordAdaptive(G.topic, correct);
  }
  if(correct){
    G.correct += primary ? 1 : 0;
    if(!primary) G.fixed++;
    if(primary){
      if(G.sawWrong && G.streak+1>=4) G.comeback = true;
      G.streak++; G.best = Math.max(G.best, G.streak);
    }
    const full = Math.round((8 + 4*G.cur.tier) * comboMult(G.streak) * (1 + bonusPct()/100));
    let gained = G.helpedThis ? Math.ceil(full/2) : full;
    if(!primary) gained = Math.ceil(gained/2);
    if(G.helpedThis) wkSpend(full - Math.ceil(full/2));
    G.k += gained; S.gems += gained; wkEarn(gained);
    // celebrate
    const m = $('mascot'); m.classList.remove('mmbounce'); void m.offsetWidth; m.classList.add('mmbounce');
    const fl = document.createElement('div'); fl.className='kfloat'; fl.textContent = '+'+gained;
    $('mascotwrap').appendChild(fl); setTimeout(()=>fl.remove(), 1000);
    confetti($('mascotwrap'));
    const chip = $('coinchip'); chip.classList.remove('chippop'); void chip.offsetWidth; chip.classList.add('chippop');
    $('p-k').textContent = fmtK(S.gems);
    sfx.correct(G.streak);
    updateStreakline();
    save();
    pendT = setTimeout(nextQ, 1000);
  } else {
    if(primary){ G.wrong++; G.streak = 0; G.sawWrong = true; if(!G.test) G.queue.push(G.cur); }
    sfx.wrong();
    updateStreakline();
    save();
    $('wrongbox').innerHTML = `<div class="wrongbanner pop"><span>Not this one — it's actually <b style="margin-left:4px;">${G.cur.ans}</b></span>
      <button class="btn sm dark" id="btn-nextq">Next →</button></div>`;
    $('btn-nextq').onclick = nextQ;
  }
}
function confetti(el){
  const r = el.getBoundingClientRect();
  for(let i=0;i<6;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.background = CONFETTI[i];
    p.style.left = (r.left + r.width/2)+'px'; p.style.top = (r.top + r.height/2)+'px';
    p.style.setProperty('--dx', (ri(-80,80))+'px');
    p.style.setProperty('--dy', (ri(-90,30))+'px');
    document.body.appendChild(p); setTimeout(()=>p.remove(), 850);
  }
}

$('btn-teach').onclick = ()=>{

function openTeach(){

function renderTeach(){

/* ---------- end of round ---------- */
function endRound(){
  clearTimeout(pendT); clearTimeout(idleT); clearInterval(sessInt);
  stopSpeak();
  document.body.classList.remove('live');
  if(!G) return;
  const g = G; G = null;
  if(g.test){ finishTest(g); return; }
  const total = g.correct + g.wrong;
  if(total===0){ renderHome(); go('home'); return; }
  const acc = g.correct/total;
  const durSec = Math.round((Date.now()-g.start)/1000);
  S.stats.totalMs += durSec*1000;
  const today = todayStr();
  if(S.stats.daily.last !== today){
    const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
    S.stats.daily.streak = (S.stats.daily.last===y) ? S.stats.daily.streak+1 : 1;
    S.stats.daily.last = today;
  }
  S.stats.sessions.push({d:today, t:g.topic, g:S.grade, c:g.correct, w:g.wrong, k:g.k, best:g.best, sec:durSec, quick:g.quick, h:g.helpCount, fixed:g.fixed});
  if(S.stats.sessions.length>60) S.stats.sessions = S.stats.sessions.slice(-60);
  // ticket milestones (standard rounds only)
  let gotTicket = 0;
  if(!g.quick){
    ensureTk();
    if(total>=10 && acc>=0.6 && !S.tk.dayPlay){
      S.tk.dayPlay = true;
      if(!S.tk.weekDays.includes(today)) S.tk.weekDays.push(today);
      gotTicket += awardT(1, 'daily session done');
      if(S.tk.weekDays.length>=5 && !S.tk.weekStreakGiven){ S.tk.weekStreakGiven = true; gotTicket += awardT(3, '5 days this week'); }
    }
    if(total>=12 && acc>=0.8 && !S.tk.dayAcc && S.grade===unlockedUpTo()){
      S.tk.dayAcc = true;
      gotTicket += awardT(1, 'sharp round: 80%+');
    }
  }
  save();
  const headline = g.comeback && acc<0.8 ? 'Comeback. Respect.'
    : acc>=0.999 ? 'Clean run. W.'
    : acc>=0.8 ? 'Clean run. W.'
    : g.best>=6 ? 'On fire.'
    : 'Round done.';
  const blob = acc>=0.8 ? ILLOS.party : ILLOS[WORLD[g.topic].blob];
  $('endcol').innerHTML = `
    <span class="blob pop">${blob}</span>
    <h1>${headline}</h1>
    <p class="body">${g.fixed>0 ? `Fixed ${g.fixed} from earlier — that's how it's done.` : (g.comeback ? 'Rough start, strong finish.' : `${WORLD[g.topic].name} · ${g.quick?'quick 6':'12 questions'}.`)}</p>
    <div class="statrow">
      <div class="statcard"><b>+${fmtK(g.k)}</b><span>Kredits</span></div>
      <div class="statcard"><b>${Math.round(acc*100)}%</b><span>Accuracy</span></div>
      <div class="statcard"><b>×${comboMult(g.best)>1?comboMult(g.best):1} · ${g.best}</b><span>Best combo</span></div>
    </div>
    ${gotTicket>0 ? `<div class="tixbanner">${IC.ticket} +${gotTicket} ticket${gotTicket>1?'':''} — nice.</div>` : ''}
    <div style="display:flex; gap:12px;">
      <button class="btn primary big" id="e-again">Run it back</button>
      <button class="btn big" id="e-home">Home</button>
    </div>`;
  $('e-again').onclick = ()=>startRound(g.topic, {quick:g.quick});
  $('e-home').onclick = ()=>{ renderHome(); go('home'); };
  go('end');
  sfx.end();
}

/* test answers route through resolveAnswer? Tests need their own path: override in resolveAnswer via G.test */
const _resolveAnswer = resolveAnswer;
resolveAnswer = function(correct, tapped){
  if(G && G.test){
    G.locked = true;
    stopSpeak();
    document.body.classList.remove('live');
    const pt = G.perTopic[G.topic] = G.perTopic[G.topic]||{c:0,w:0};
    if(correct){
      G.correct++; pt.c++;
      const m = $('mascot'); m.classList.remove('mmbounce'); void m.offsetWidth; m.classList.add('mmbounce');
      confetti($('mascotwrap'));
      sfx.correct(Math.min(G.correct,10));
      G.idx++;
      pendT = setTimeout(nextTestQ, 800);
    } else {
      G.wrong++; pt.w++;

        <button class="btn sm dark" id="btn-nextq">Next →</button></div>`;
      G.idx++;
      $('btn-nextq').onclick = nextTestQ;
    }
    return;
  }
  _resolveAnswer(correct, tapped);
};
function finishTest(g){
  const pct = Math.round(g.correct/20*100);
  const passed = g.correct >= 16;
  const tst = S.tests[S.grade] = S.tests[S.grade]||{best:0, tries:0};
  tst.tries++; tst.best = Math.max(tst.best, pct);
  if(passed){
    const pg = S.grade;
    S.passed[pg] = true;
    if(pg<8){ S.maxG = Math.max(S.maxG, pg+1); S.grade = pg+1; }
    awardT(3, `passed the grade ${pg} test`, true);

    $('testresultcol').innerHTML = `

  go('testresult');

function renderStand(){

  const B = S.biz;
  const res = B.result;
  $('standcol').innerHTML = `
    <div class="shophead"><span class="blob" style="width:82px; height:82px;">${ILLOS.startup}</span>
      <div><div class="h1" style="font-size:40px;">Lemonade stand</div>
      <div class="body">Run a real business with the math you know. Profit banks as Kredits, ×10.</div></div></div>
    <div class="standgrid">
      <div class="card railcard">
        <div class="kicker" style="margin-bottom:12px;">Set up your day</div>
        <div style="font-weight:800; font-size:15px; margin-bottom:8px;">Price per cup</div>
        <div class="seg" id="st-price">${[1,2,3].map(p=>`<button data-p="${p}" class="${B.price===p?'on':''}">$${p}</button>`).join('')}</div>
        <div style="font-weight:800; font-size:15px; margin:16px 0 2px;">Cups to make</div>
        <div class="meta" style="margin-bottom:8px;">Each cup costs $0.50 in supplies — even if it doesn't sell.</div>
        <div class="seg" id="st-cups">${[10,20,30].map(c=>`<button data-c="${c}" class="${B.made===c?'on':''}">${c} cups</button>`).join('')}</div>
        <div class="forecast"><i style="background:${fc==='sunny'?'#E8C94F':'#B5B0A4'};"></i>Forecast: ${fc==='sunny'?'Sunny — more thirsty people':'Cloudy — fewer thirsty people'}</div>
        <button class="btn primary big" id="st-open" style="width:100%;">Open the stand</button>
      </div>
      <div class="card railcard" id="st-result">
        ${res ? standResultHTML(res) : `<div class="empty" style="border:none;">${ILLOS.vision}Pick a price, make some cups, open up.<br>Your day's numbers land here.</div>`}
      </div>
    </div>`;
  $('st-price').querySelectorAll('button').forEach(b=>b.onclick = ()=>{ B.price=+b.dataset.p; save(); renderStand(); });
  $('st-cups').querySelectorAll('button').forEach(b=>b.onclick = ()=>{ B.made=+b.dataset.c; save(); renderStand(); });
  $('st-open').onclick = ()=>{
    const base = {1:36, 2:22, 3:12}[B.price];
    const demand = Math.round(base * (fc==='sunny'?1.2:0.8));
    const sold = Math.min(B.made, demand);
    const revenue = sold * B.price;
    const cost = B.made * 0.5;
    const profit = revenue - cost;
    B.result = {price:B.price, made:B.made, fc, demand, sold, revenue, cost, profit, banked:false};
    save(); renderStand();
  };
  renderNav();
}
function standResultHTML(r){
  const head = r.profit>0 ? 'Profit. W.' : r.profit===0 ? 'Broke even.' : 'Lost money. Happens.';
  const canBank = r.profit>0 && !r.banked && S.biz.bankedDay!==todayStr();
  return `
    <div class="h1" style="font-size:30px; margin-bottom:12px;">${head}</div>
    <div class="ledrow"><span>Cups sold</span><b>${r.sold} of ${r.made}</b></div>
    <div class="ledrow"><span>People who wanted one</span><b>${r.demand}</b></div>
    <div class="ledrow"><span>Money in</span><b class="pos">$${r.revenue.toFixed(2)}</b></div>
    <div class="ledrow"><span>Supplies cost</span><b class="neg">−$${r.cost.toFixed(2)}</b></div>
    <div class="ledrow"><span>Profit</span><b class="${r.profit>=0?'pos':'neg'}">${r.profit<0?'−':''}$${Math.abs(r.profit).toFixed(2)}</b></div>
    <div class="mathbox"><b>The math:</b><br>
      1 · ${r.sold} cups × $${r.price} = $${r.revenue.toFixed(2)} in<br>
      2 · ${r.made} cups × $0.50 = $${r.cost.toFixed(2)} out<br>
      3 · $${r.revenue.toFixed(2)} − $${r.cost.toFixed(2)} = ${r.profit<0?'−':''}$${Math.abs(r.profit).toFixed(2)}</div>
    <div style="display:flex; gap:10px; margin-top:16px;">
      ${canBank ? `<button class="btn gold" id="st-bank">Bank it · +${Math.round(r.profit*10)} Kredits</button>` : (r.banked?`<span class="meta" style="align-self:center;">Banked. Come back tomorrow.</span>`:'')}
      <button class="btn" id="st-retry">Tweak and retry</button>
    </div>`;
}
document.addEventListener('click', e=>{
  if(e.target.id==='st-bank'){
    const r = S.biz.result;
    if(!r || r.profit<=0 || r.banked) return;
    const pay = Math.round(r.profit*10);
    S.gems += pay; wkEarn(pay);
    r.banked = true; S.biz.bankedDay = todayStr();
    sfx.milestone(); toast(`+${pay} Kredits banked. Business is business.`);
    save(); renderStand();
  }
  if(e.target.id==='st-retry'){ S.biz.result = null; save(); renderStand(); }
});

/* ---------- grown-ups ---------- */
function renderParent(){
  ensureTk();
  const st = S.stats;
  const pend = S.redemptions.filter(r=>r.status==='requested');
  const weak = Object.entries(st.skills).map(([name,d])=>({name, n:d.c+d.w, h:d.h||0, acc:(d.c+d.w)?d.c/(d.c+d.w):0}))
    .filter(s=>s.n>=6 && s.acc<0.7).sort((a,b)=>a.acc-b.acc).slice(0,5);
  const allSkills = Object.entries(st.skills).map(([name,d])=>({name, c:d.c, n:d.c+d.w, h:d.h||0}))
    .filter(s=>s.n>0).sort((a,b)=>(a.c/a.n)-(b.c/b.n)).slice(0,14);
  refreshVoices();
  const voiceOpts = ['<option value="">Auto — best available</option>']
    .concat(VOICES.map(v=>`<option value="${v.name.replace(/"/g,'&quot;')}" ${S.voiceName===v.name?'selected':''}>${v.name}</option>`)).join('');
  $('parentcol').innerHTML = `
    <div class="shophead"><span class="blob" style="width:82px; height:82px;">${ILLOS.analytics}</span>
      <div><div class="h1" style="font-size:40px;">Grown-ups</div>
      <div class="body">Placement, progress, and the reward faucet. Your kid doesn't see this page.</div></div></div>
    <div class="pargrid">
      <div>
        <div class="parh">Grade placement</div>
        <div class="pgradebtns">${[3,4,5,6,7,8].map(g=>`<button data-pg="${g}" class="${S.grade===g?'on':''}">${S.passed[g]?'✓':''}${g}</button>`).join('')}</div>
        <div class="meta" style="margin-top:8px;">Placing unlocks that grade and below. She levels further by passing each grade's test (20 questions, 80%). Tests so far: ${Object.entries(S.tests).map(([g,t])=>`G${g} best ${t.best}% (${t.tries}×)`).join(' · ')||'none yet'}.</div>
        <div class="parh">Accuracy by world — Grade ${S.grade}</div>
        <div class="card railcard">
          ${WKEYS.map(k=>{
            const d = st.topics[S.grade+'_'+k]; const n = d?d.c+d.w:0; const acc = n?Math.round(d.c/n*100):0;
            return `<div class="accrow"><span class="albl">${WORLD[k].name}</span>
              <span class="bar"><i style="width:${acc}%; background:${WORLD[k].color};"></i></span>
              <span class="aval">${n?acc+'% · '+n+'q':'no data'}</span></div>`;
          }).join('')}
        </div>
        <div class="parh">Suggested focus</div>
        ${weak.length ? weak.map(s=>`<div class="focusrow"><i></i><b>${s.name}</b> — ${Math.round(s.acc*100)}% over ${s.n} tries${s.h?`, ${s.h} hints`:''}</div>`).join('')
          : `<div class="meta">Nothing under 70% with enough tries. This fills in as she plays.</div>`}
        ${allSkills.length?`<div class="parh">Skills</div><div class="card railcard"><table class="sk">
          <tr><th>Skill</th><th>Tries</th><th>Hints</th><th>Accuracy</th></tr>
          ${allSkills.map(s=>{const a=Math.round(s.c/s.n*100); return `<tr><td>${s.name}</td><td>${s.n}</td><td>${s.h||''}</td><td class="${a<70?'lowacc':''}">${a}%</td></tr>`;}).join('')}
        </table></div>`:''}
      </div>
      <div>
        <div class="parh">Tickets</div>
        <div class="card railcard">
          <div class="setrow"><span>Balance</span><b>${IC.ticket} ${S.tickets}</b></div>
          <div class="setrow"><span>Earned this week</span><b>${S.tk.weekEarned} / ${S.tk.weekCap||10}</b></div>
          <div class="setrow"><span>Weekly cap</span><input type="number" class="inp" id="p-cap" min="0" max="99" value="${S.tk.weekCap||10}" style="width:74px; text-align:right;"></div>
          <div class="meta" style="padding-top:10px;">Milestone-earned only — never per answer. 1 ticket ≈ 50¢.</div>
        </div>
        ${pend.length?`<div class="parh">Waiting for you</div>${pend.map(r=>`
          <div class="waitrow"><span>${r.name} · ${r.cost} 🎟 · ${r.d}</span>
          <span style="display:flex; gap:8px;"><button class="btn sm primary" data-given="${r.id}">✓ Given</button>
          <button class="btn sm" data-refund="${r.id}">Refund</button></span></div>`).join('')}`:''}
        <div class="parh">Reward menu</div>
        <div class="card railcard" id="p-rewmenu">
          ${S.rewards.map(r=>`<div class="setrow"><input class="inp" data-rname="${r.id}" value="${String(r.name).replace(/"/g,'&quot;')}" style="flex:1;">
            <input class="inp" type="number" data-rcost="${r.id}" min="1" max="99" value="${r.cost}" style="width:64px; text-align:right;">
            <button class="btn sm" data-rdel="${r.id}">✕</button></div>`).join('')}
          <button class="btn sm" id="p-addrew" style="margin-top:10px;">+ Add reward</button>
        </div>
        <div class="parh">Settings</div>
        <div class="card railcard">
          <div class="setrow"><div><div style="font-weight:700;">Session length</div><div class="meta">Gentle wind-down banner, never a cutoff.</div></div>
            <div class="seg" id="p-sess">${[0,10,15,20].map(m=>`<button data-m="${m}" class="${S.sessionLen===m?'on':''}" style="padding:7px 11px; font-size:13px;">${m===0?'Off':m+'m'}</button>`).join('')}</div></div>
          <div class="setrow"><div><div style="font-weight:700;">Focus mode</div><div class="meta">Hides Kredits & streak while a question is live.</div></div>
            <button class="toggle ${S.focusMode?'on':''}" id="p-focus"><i></i></button></div>
          <div class="setrow"><div><div style="font-weight:700;">Sound</div></div>
            <button class="toggle ${S.sound?'on':''}" id="p-sound"><i></i></button></div>
          <div class="setrow" style="display:block;"><div style="font-weight:700;">Read-aloud voice</div>
            <select class="sel" id="p-voice">${voiceOpts}</select>
            <button class="btn sm" id="p-voicetest" style="margin-top:8px;">▶ Preview</button></div>
          <div class="setrow"><div><div style="font-weight:700; color:var(--red);">Erase everything</div></div>
            <button class="btn sm" id="p-reset">Reset…</button></div>
        </div>
        <button class="backlink" id="p-back">← Back to the kid side</button>
      </div>
    </div>`;
  const col = $('parentcol');
  col.querySelectorAll('[data-pg]').forEach(b=>b.onclick = ()=>{ S.grade=+b.dataset.pg; S.maxG=Math.max(S.maxG,S.grade); save(); renderParent(); });
  $('p-cap').onchange = ()=>{ S.tk.weekCap = Math.max(0, Math.min(99, parseInt($('p-cap').value)||0)); save(); };
  col.querySelectorAll('[data-given]').forEach(b=>b.onclick = ()=>{ const r=S.redemptions.find(x=>String(x.id)===b.dataset.given); if(r){r.status='given'; save(); renderParent();} });
  col.querySelectorAll('[data-refund]').forEach(b=>b.onclick = ()=>{ const i=S.redemptions.findIndex(x=>String(x.id)===b.dataset.refund); if(i>=0){S.tickets+=S.redemptions[i].cost; S.redemptions.splice(i,1); save(); renderParent();} });
  col.querySelectorAll('[data-rname]').forEach(inp=>inp.onchange = ()=>{ const r=S.rewards.find(x=>String(x.id)===inp.dataset.rname); if(r){r.name=inp.value.slice(0,60)||'Reward'; save();} });
  col.querySelectorAll('[data-rcost]').forEach(inp=>inp.onchange = ()=>{ const r=S.rewards.find(x=>String(x.id)===inp.dataset.rcost); if(r){r.cost=Math.max(1,Math.min(99,parseInt(inp.value)||1)); save();} });
  col.querySelectorAll('[data-rdel]').forEach(b=>b.onclick = ()=>{ S.rewards=S.rewards.filter(x=>String(x.id)!==b.dataset.rdel); save(); renderParent(); });
  $('p-addrew').onclick = ()=>{ S.rewards.push({id:Date.now(), name:'New reward', cost:5}); save(); renderParent(); };
  col.querySelectorAll('#p-sess button').forEach(b=>b.onclick = ()=>{ S.sessionLen=+b.dataset.m; save(); renderParent(); });
  $('p-focus').onclick = ()=>{ S.focusMode=!S.focusMode; save(); applyTheme(); renderParent(); };
  $('p-sound').onclick = ()=>{ S.sound=!S.sound; save(); renderParent(); };
  $('p-voice').onchange = ()=>{ S.voiceName = $('p-voice').value; save(); };
  $('p-voicetest').onclick = ()=>{ S.voiceName = $('p-voice').value; save(); speak('Hi! Here is how I read a problem. Negative ten plus three. Walk three steps to the right. You land on negative seven.'); };
  let armed = false;
  $('p-reset').onclick = ()=>{
    if(!armed){ armed=true; $('p-reset').textContent='Tap again to erase'; setTimeout(()=>{armed=false; const b=$('p-reset'); if(b) b.textContent='Reset…';}, 2500); }
    else { store.clear(); S = freshState(); save(); applyTheme(); startOnb(0); }
  };
  $('p-back').onclick = ()=>{ renderHome(); go('home'); };
  renderNav();
}

/* ---------- number-line data on integer generators ---------- */
(function(){
  const wrap = (gi) => {
    const orig = GEN.int[1][gi];
    GEN.int[1][gi] = function(){
      const p = orig();
      const m = String(p.q).replace(/−/g,'-').match(/^(-?\d+)\s*[+\-]\s*(-?\d+)$/);
      const v = valOf(p.ans);
      if(m && v!==null && Math.abs(v)<=20 && Math.abs(+m[1])<=20) p.nl = {from:+m[1]};
      return p;
    };
  };
  wrap(0); wrap(1);   // adding negatives, subtracting into negatives
})();

/* ---------- boot ---------- */
applyTheme();
if(!S.onboarded) startOnb(0);
else { renderHome(); go('home'); }

</script>
</body>
</html>
